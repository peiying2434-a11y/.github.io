<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乖乖科技聯名專案 - 讓你的設備永不當機</title>
    <style>
        /* 核心設計風格：綠色乖乖 + 科技黑白 */
        :root {
            --kuai-green: #2ecc71;
            --tech-dark: #1a1a1a;
            --tech-light: #f5f6fa;
            --accent-gold: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--tech-light);
            color: #333;
            line-height: 1.6;
        }

        /* 導覽列 */
        header {
            background-color: var(--tech-dark);
            color: white;
            padding: 15px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--kuai-green);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--kuai-green);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--kuai-green);
        }

        /* 主視覺區 */
        .hero {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            color: white;
            text-align: center;
            padding: 100px 20px;
            border-bottom: 10px solid var(--kuai-green);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--kuai-green);
        }

        .hero p {
            font-size: 20px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .badge {
            background-color: var(--kuai-green);
            color: var(--tech-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 區塊通用樣式 */
        section {
            padding: 80px 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            position: relative;
            color: var(--tech-dark);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--kuai-green);
            margin: 10px auto 0;
        }

        /* 產品說明區塊 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--kuai-green);
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card h3 {
            font-size: 22px;
            margin-bottom: 15px;
            color: var(--tech-dark);
        }

        /* 聯名款主機商品設計區塊 */
        .pc-design-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            border: 2px solid var(--kuai-green);
        }

        .pc-visual {
            flex: 1;
            min-width: 300px;
            background: linear-gradient(45deg, #111, #222);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }

        .pc-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
            border: 2px solid var(--kuai-green);
            margin-bottom: 15px;
        }

        .pc-info {
            flex: 1.2;
            min-width: 350px;
            padding: 40px;
        }

        .tech-specs-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .tech-specs-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .tech-specs-table td:first-child {
            font-weight: bold;
            color: var(--tech-dark);
            width: 30%;
        }

        .buy-btn {
            display: inline-block;
            background-color: var(--kuai-green);
            color: var(--tech-dark);
            font-weight: bold;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .buy-btn:hover {
            transform: scale(1.05);
            background-color: #27ae60;
            color: white;
        }

        /* 公司介紹區塊 */
        .about-container {
            display: flex;
            flex-wrap: wrap;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .about-text {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            background: var(--tech-dark);
            color: #ccc;
        }

        .about-text h3 {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .about-brand {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 顧客感想區塊 */
        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .testimonial-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 4px solid var(--kuai-green);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .testimonial-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.15);
            background-color: #fafdfb;
        }

        /* 點擊播放的提示小標籤 */
        .play-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 12px;
            color: var(--kuai-green);
            font-weight: bold;
            opacity: 0.7;
        }

        .testimonial-card:hover .play-hint {
            opacity: 1;
        }

        /* 本機影片彈窗遮罩樣式 */
        .video-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.5);
            overflow: hidden;
        }

        .close-btn {
            position: absolute;
            top: -40px; right: 0;
            color: white;
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
        }

        /* 頁尾 */
        footer {
            background-color: var(--tech-dark);
            color: #aaa;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            border-top: 3px solid var(--kuai-green);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <header>
        <div class="logo">🟢 乖乖科技聯名</div>
        <nav>
            <a href="#products">聯名概念</a>
            <a href="#pc-design">旗艦聯名主機</a>
            <a href="#about">關於我們</a>
            <a href="#testimonials">顧客好評</a>
        </nav>
    </header>

    <!-- 主視覺 -->
    <div class="hero">
        <span class="badge">COMPUTEX 限量特仕款</span>
        <h1>機房鎮邪必備・乖乖電腦特仕版</h1>
        <p>當「綠色椰子乖乖」遇上「頂級次世代伺服器主機」。不只滿足科技人的胃，更完美注入「綠燈不當機」的終極科技信仰。</p>
    </div>

    <!-- 產品說明區塊 -->
    <section id="products">

        <div class="product-grid">

            </div>
            <div class="product-card">
                <h3>🛡️ 科技能量御守貼紙</h3>
